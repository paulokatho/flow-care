        <div>
          <h1 class="text-3xl font-bold">FlowChat</h1>
          <p class="text-blue-200">Assistente virtual para encontrar medicamentos</p>
        </div>
      </div>
    </header>

    <main>
      <div class="chat-container bg-white rounded-b-xl shadow-lg p-6">
        <div id="chat-messages" class="mb-6 space-y-4 h-96 overflow-y-auto p-4 border-b" aria-live="polite">
          <div class="chat-message bg-blue-50 text-blue-800 p-4 rounded-lg max-w-xs">
            <p class="font-medium">
              Olá! Sou o assistente virtual do FlowChat. Digite o nome do medicamento que deseja encontrar e eu vou te ajudar!
            </p>
          </div>
        </div>

        <div class="relative">
          <div class="flex space-x-2">
            <input
              type="text"
              id="medicine-input"
              placeholder="Digite o nome do medicamento (Ex: Paracetamol)"
              class="flex-1 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
              autocomplete="off"
            />
            <button
              id="search-button"
              class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-medium transition duration-300"
            >
              Buscar
            </button>
          </div>
          <div id="autocomplete-results" class="absolute w-full bg-white rounded-b-lg shadow-md mt-1 border border-gray-200 hidden"></div>
        </div>
      </div>

      <div id="results-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-8"></div>
    </main>
  </div>

            { pharmacyId: 2, price: 18.50, quantity: "200mg 30 cápsulas", inStock: true },

          ]
        },
        {
          id: 20,
          name: "Clonazepam",
          description: "Benzodiazepínico usado no tratamento de distúrbios de ansiedade, insônia e convulsões.",
          expandedDetails: "Clonazepam é um medicamento controlado para ansiedade e convulsões. Causa dependência e deve ser usado com extrema cautela e sob supervisão médica. Não misture com álcool.",
          variants: [

            { pharmacyId: 2, price: 15.50, quantity: "2mg 20 cápsulas", inStock: true },
            { pharmacyId: 3, price: 20.99, quantity: "2mg 20 cápsulas", inStock: true }

        }

      // ===== Elementos do DOM =====
      const medicineInput = document.getElementById("medicine-input");
      const searchButton = document.getElementById("search-button");
      const chatMessages = document.getElementById("chat-messages");
      const resultsContainer = document.getElementById("results-container");
      const autocompleteResults = document.getElementById("autocomplete-results");

      // ===== Funções utilitárias =====
      function addMessage(text, isUser  = false) {
        const messageDiv = document.createElement("div");
        messageDiv.className = `chat-message ${
          isUser  ? "bg-gray-100 text-gray-800 ml-auto" : "bg-blue-50 text-blue-800"
        } p-4 rounded-lg max-w-xs`;
        const messageText = document.createElement("p");
        messageText.className = "font-medium";
        messageText.textContent = text;
        messageDiv.appendChild(messageText);
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      function clearResults() {
        resultsContainer.innerHTML = "";
      }

      function renderMedicineCard(med, variant) {
        const pharmacy = pharmacies.find((p) => p.id === variant.pharmacyId);
        const stockStatusText = variant.inStock ? "Em estoque" : "Indisponível";
        const stockStatusColor = variant.inStock ? "bg-green-500" : "bg-red-500";

        const card = document.createElement("div");
        card.className =
          "medicine-card bg-white p-6 rounded-xl shadow-md border border-gray-100 transition duration-300 hover:border-blue-200";

        card.innerHTML = `
          <div class="flex justify-between items-start mb-4">
            <h3 class="text-xl font-bold text-blue-800">${med.name}</h3>
            <img src="${pharmacy.logo}" alt="${pharmacy.name}" class="h-6" />
          </div>
          <p class="text-gray-600 mb-4">${med.description}</p>
          <div class="flex justify-between items-center">
            <span class="text-gray-500">${variant.quantity}</span>
            <span class="text-2xl font-bold text-blue-600">R$ ${variant.price
              .toFixed(2)
              .replace(".", ",")}</span>
          </div>
          <div class="mt-4 text-sm text-gray-500 flex items-center">
            <span class="inline-block w-3 h-3 rounded-full ${stockStatusColor} mr-2"></span>
            ${stockStatusText} na ${pharmacy.name}
          </div>
          <div class="mt-4 flex justify-end">
            <button class="details-toggle text-blue-600 hover:text-blue-800 transition duration-300 font-medium">Mais detalhes</button>
          </div>
          <div class="details-panel hidden mt-4 p-4 border rounded-lg bg-gray-50">
            <p class="text-sm text-gray-700">${med.expandedDetails}</p>
          </div>
        `;

        return card;
      }

      function searchMedicine() {
        const term = medicineInput.value.trim().toLowerCase();
        if (!term) {
          addMessage("Por favor, digite o nome de um medicamento para eu buscar.");
          return;
        }
        autocompleteResults.classList.add("hidden");
        addMessage(term, true);
        medicineInput.value = "";

        const found = medicines.filter((m) => m.name.toLowerCase().includes(term));
        if (found.length === 0) {
          addMessage(`Não encontrei o medicamento "${term}". Verifique a escrita e tente novamente.`);
          return;
        }

        clearResults();
        addMessage(`Encontrei ${found.length} resultado(s) para "${term}":`);

        found.forEach((med) => {
          med.variants.forEach((variant) => {
            const card = renderMedicineCard(med, variant);
            resultsContainer.appendChild(card);
          });
        });
      }

      function showSuggestions() {
        const term = medicineInput.value.trim().toLowerCase();
        autocompleteResults.innerHTML = "";

        if (term.length > 1) {
          const uniqueSuggestions = [
            ...new Set(
              medicines.filter((m) => m.name.toLowerCase().startsWith(term)).map((m) => m.name)
            ),
          ];
          uniqueSuggestions.forEach((suggestion) => {
            const div = document.createElement("div");
            div.textContent = suggestion;
            div.className = "autocomplete-item";
            autocompleteResults.appendChild(div);
          });
          autocompleteResults.classList.remove("hidden");
        } else {
          autocompleteResults.classList.add("hidden");
        }
      }

      function onDetailsToggleClick(event) {
        const btn = event.target.closest(".details-toggle");
        if (!btn) return;
        const card = btn.closest(".medicine-card");
        if (!card) return;
        const panel = card.querySelector(".details-panel");
        const isHidden = panel.classList.contains("hidden");
        panel.classList.toggle("hidden");
        btn.textContent = isHidden ? "Menos detalhes" : "Mais detalhes";
      }

      function onSuggestionClick(event) {
        const item = event.target.closest(".autocomplete-item");
        if (!item) return;
        medicineInput.value = item.textContent;
        autocompleteResults.classList.add("hidden");
        searchMedicine();
      }

      function setupListeners() {
        searchButton.addEventListener("click", searchMedicine);
        medicineInput.addEventListener("keypress", function (e) {
          if (e.key === "Enter") {
            searchMedicine();
          }
        });
        medicineInput.addEventListener("input", showSuggestions);

        resultsContainer.addEventListener("click", onDetailsToggleClick);
        autocompleteResults.addEventListener("click", onSuggestionClick);

        document.addEventListener("click", function (e) {
          const rel = e.target.closest(".relative");
          if (!rel) {
            autocompleteResults.classList.add("hidden");
          }
        });
      }

      function init() {
        setupListeners();
      }

      init();
    })();

</body>
</html>
